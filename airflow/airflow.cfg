# 家電專案的 Airflow 非機密設定。
# AIRFLOW__區段__選項 環境變數的優先順序高於本檔案。
# 資料庫連線、Fernet key 與 Web 密鑰放在專案根目錄 .env。
# 未列出的選項使用 Airflow 2.10.5 的預設值。

[core]
# DAG 已透過 Dockerfile.airflow 複製進 image。
dags_folder = /opt/airflow/dags
# 讓 webserver 可透過 worker IP 讀取尚未完成的任務日誌。
hostname_callable = airflow.utils.net.get_host_ip_address
default_timezone = Asia/Taipei
# DAG 任務交給 Airflow worker；爬蟲由獨立的 RabbitMQ worker 執行。
executor = CeleryExecutor
# 新 DAG 建立時預設啟用；已存在的 DAG 保留其暫停狀態。
dags_are_paused_at_creation = False
load_examples = False

[database]
# Airflow metadata 使用獨立的 MySQL 資料庫；連線字串由 .env 的
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN 提供，不寫入 image。
# 連線池數值與 Airflow 2.10.5 預設值相同。
sql_alchemy_pool_enabled = True
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10
sql_alchemy_pool_recycle = 1800
sql_alchemy_pool_pre_ping = True

[celery]
# Airflow 專用 Redis：0 儲存任務佇列，1 儲存 Celery 任務結果。
# 與爬蟲使用的 RabbitMQ 無關；Redis 僅供受信任的內部網路使用。
broker_url = redis://airflow-redis:6379/0
result_backend = redis://airflow-redis:6379/1
worker_concurrency = 2

[webserver]
# 排程仍以 DAG 的時區為準，這裡只控制網頁顯示。
default_ui_timezone = Asia/Taipei
