[project]
name = "tibame-pchome-price-api"
version = "0.1.0"
description = "PChome appliance price comparison API for Tibame crawler data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
