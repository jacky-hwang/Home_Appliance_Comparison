[project]
name = "crawler"
version = "0.0.1"
description = "PChome appliance ranking crawler and price data collection"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "celery==5.5.0",
    "loguru==0.6.0",
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.50,<2",
    "apscheduler==3.10.4",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]==1.1.1",
    "pandas>=2.2,<3",
    "fastapi==0.140.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]
