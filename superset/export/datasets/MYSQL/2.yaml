schema: tibame
sql: "\nSELECT category, product_id,\n       MAX(CASE WHEN name_rank = 1 THEN product_name\
  \ END) AS product_name,\n       CONCAT(LEFT(MAX(CASE WHEN name_rank = 1 THEN product_name\
  \ END), 12), '… ', product_id) AS product_label,\n       COUNT(DISTINCT scrape_date)\
  \ AS days_on_chart\nFROM (\n    SELECT category, product_id, product_name, scrape_date,\n\
  \           ROW_NUMBER() OVER (\n               PARTITION BY category, product_id\n\
  \               ORDER BY scrape_date DESC, rank_position ASC, id DESC\n        \
  \   ) AS name_rank\n    FROM crawl_results\n) AS rankings\nGROUP BY category, product_id\n"
